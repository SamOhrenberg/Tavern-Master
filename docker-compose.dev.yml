# Development helper: just Postgres with pgvector on localhost.
#
#   docker compose -f docker-compose.dev.yml up -d     (or: npm run dev:db)
#   DATABASE_URL=postgres://tavern:tavern@localhost:55432/tavern
#
# The port is deliberately not 5432, so it never collides with a Postgres
# already installed on the machine. Change it with DEV_DB_PORT.
name: tavern-dev

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tavern
      POSTGRES_PASSWORD: tavern
      POSTGRES_DB: tavern
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-55432}:5432'
    volumes:
      - devdb:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tavern -d tavern']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  devdb: {}
