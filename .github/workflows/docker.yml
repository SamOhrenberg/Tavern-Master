name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  schedule:
    # Re-scan the published image weekly so new CVEs in the base image surface.
    - cron: '23 5 * * 1'
  # Run by hand from the Actions tab. On main it publishes like a push.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  # Images are published for pushes, and for runs by hand on main.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      # upload-sarif reads the run it belongs to.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Build for the runner's architecture first so the image can be scanned
      # and smoke-tested before anything is pushed.
      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tavern:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" \
            -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^LLM_PROVIDER=.*|LLM_PROVIDER=mock|" \
            -e "s|^EMBEDDING_PROVIDER=.*|EMBEDDING_PROVIDER=none|" \
            -e "s|^TAVERN_IMAGE=.*|TAVERN_IMAGE=tavern:ci|" .env
          docker compose up -d --no-build --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsSI http://127.0.0.1:8080/ | grep -i content-security-policy
          docker compose down -v

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tavern:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Code scanning needs a public repo (or Advanced Security), so a failed
      # upload never blocks publishing; the next step is the real gate.
      - name: Upload scan results
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tavern:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # The DM launcher (Claude on call): Claude Code and one script. Built on
      # every run so a broken Dockerfile shows up in review; pushed with the app.
      - id: meta-dm
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}-dm-launcher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push the DM launcher (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dm-launcher.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta-dm.outputs.tags }}
          labels: ${{ steps.meta-dm.outputs.labels }}
          cache-from: type=gha,scope=dm-launcher
          cache-to: type=gha,mode=max,scope=dm-launcher
          provenance: true
          sbom: true
