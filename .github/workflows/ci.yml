name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  # Run by hand from the Actions tab. On main it publishes the images like a push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the run; on main, each publish finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tavern
          POSTGRES_PASSWORD: tavern
          POSTGRES_DB: tavern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tavern -d tavern_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tavern:tavern@localhost:5432/tavern_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails the build on known high/critical advisories in shipped dependencies.
      - run: npm audit --omit=dev --audit-level=high

  # The images are built, smoke-tested and scanned only once the code passes,
  # so a failing commit is never published.
  docker:
    needs: [test, audit]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      # upload-sarif reads the run it belongs to.
      actions: read
